<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Tienda...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #38bdf8;
            --text: #f8fafc;
            --admin: #fbbf24;
            --danger: #ef4444;
            --success: #22c55e;
            --glass: rgba(17, 24, 39, 0.7);
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); scroll-behavior: smooth; }

        nav {
            background: var(--glass); backdrop-filter: blur(15px); padding: 1.2rem 8%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.5rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; min-width: 50px; }

        .btn { cursor: pointer; border-radius: 10px; border: none; padding: 10px 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-blue { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: white; }
        .btn-blue:disabled { background: #374151; color: #94a3b8; cursor: not-allowed; }
        .btn-admin { background: var(--admin); color: #000; display: none; margin-right: 12px; }
        
        .btn-whatsapp { background: #25D366; color: white; width: 100%; justify-content: center; margin-top: 15px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }

        .card { background: var(--card); border-radius: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; background: #1f2937; }
        
        .stock-tag { font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.1); margin-bottom: 10px; display: inline-block; }
        .out-of-stock { color: var(--danger); font-weight: bold; }

        .delete-btn { position: absolute; top: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; display: none; z-index: 10; }
        .remove-item { color: var(--danger); cursor: pointer; font-size: 1.2rem; margin-left: 10px; }

        .qty-btn { background: #374151; color: white; border: none; width: 25px; height: 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .qty-btn:hover { background: var(--accent); color: black; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: #111827; padding: 40px; width: 90%; max-width: 400px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); overflow-y: auto; max-height: 90vh; }

        .invoice-box { background: #030712; border: 1px dashed #374151; padding: 20px; border-radius: 12px; font-family: monospace; font-size: 0.9rem; margin: 15px 0; color: #cbd5e1; }
        .invoice-line { display: flex; justify-content: space-between; margin-bottom: 5px; }

        input, select { width: 100%; padding: 14px; margin: 10px 0; background: #030712; border: 1px solid #374151; color: white; border-radius: 12px; box-sizing: border-box; }

        #loader { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 50px 0; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--accent); color: #000; padding: 12px 25px; border-radius: 50px;
            font-weight: 700; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 3000;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<nav>
    <div class="logo" id="store-logo">...</div>
    <div style="display: flex; align-items: center;">
        <button id="btn-admin" class="btn btn-admin" onclick="showModal('modalAdmin')">ADMIN</button>
        <button class="btn btn-blue" onclick="showModal('modalAuth')" id="btn-user">Acceder</button>
        <button class="btn btn-blue" onclick="showModal('modalCart')" style="margin-left: 10px;">
            <i class="fas fa-shopping-cart"></i>&nbsp;<span id="count">0</span>
        </button>
    </div>
</nav>

<div class="container">
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--accent); font-weight: 600;">Cargando productos...</p>
    </div>
    <div id="store-grid" class="grid"></div>
</div>

<div id="toast">¡Producto añadido!</div>

<div id="modalInvoice" class="modal">
    <div class="modal-content">
        <h2 style="color: var(--success); text-align: center;">&iexcl;Gracias por su compra!</h2>
        <div id="invoice-details" class="invoice-box"></div>
        <button class="btn btn-whatsapp" onclick="shareWhatsApp()">Compartir en WhatsApp</button>
        <button onclick="closeModal('modalInvoice')" style="background:none; color:white; width:100%; margin-top:15px; border:none; cursor:pointer;">Cerrar</button>
    </div>
</div>

<div id="modalAuth" class="modal">
    <div class="modal-content">
        <h2>Bienvenido</h2>
        <input type="text" id="u-in" placeholder="Usuario">
        <input type="password" id="p-in" placeholder="Clave">
        <input type="text" id="a-in" placeholder="Direcci&oacute;n (Obligatoria para envíos)">
        <button class="btn btn-blue" style="width:100%; justify-content: center;" onclick="login()">Entrar</button>
    </div>
</div>

<div id="modalAdmin" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--admin)">Gestión de Tienda</h2>
        
        <div style="margin-bottom: 20px; border-bottom: 1px solid #374151; padding-bottom: 20px;">
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px;">Nombre de la Tienda:</p>
            <div style="display:flex; gap:5px;">
                <input type="text" id="store-name-input" placeholder="Nuevo nombre..." style="margin:0">
                <button class="btn btn-blue" onclick="updateStoreName()">Actualizar</button>
            </div>
            
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; margin-top: 15px;">Costo de Envío ($):</p>
            <div style="display:flex; gap:5px;">
                <input type="number" id="shipping-cost-input" placeholder="Ej: 5" style="margin:0">
                <button class="btn btn-blue" onclick="updateShippingCost()">Guardar</button>
            </div>

            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; margin-top: 15px;">WhatsApp del Negocio (con código de país):</p>
            <div style="display:flex; gap:5px;">
                <input type="text" id="store-phone-input" placeholder="Ej: 5491122334455" style="margin:0">
                <button class="btn btn-blue" onclick="updateStorePhone()">Guardar</button>
            </div>
        </div>

        <div style="margin-bottom: 20px; border-bottom: 1px solid #374151; padding-bottom: 20px;">
            <h3 style="color:var(--admin); margin-top:0"><i class="fas fa-chart-line"></i> Contabilidad</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <div style="background: #030712; padding: 10px; border-radius: 10px; border: 1px solid #374151; text-align: center;">
                    <small style="color: #94a3b8;">Ingresos</small>
                    <h3 id="stats-total" style="margin: 5px 0; color: var(--success);">$0</h3>
                </div>
                <div style="background: #030712; padding: 10px; border-radius: 10px; border: 1px solid #374151; text-align: center;">
                    <small style="color: #94a3b8;">Ventas</small>
                    <h3 id="stats-cantidad" style="margin: 5px 0; color: var(--accent);">0</h3>
                </div>
            </div>
            <button class="btn btn-blue" style="width:100%; margin-bottom:10px; justify-content:center" onclick="cargarContabilidad()">Actualizar Reporte</button>
            
            <div style="max-height: 150px; overflow-y: auto; background: #030712; border-radius: 10px; border: 1px solid #374151; font-size: 0.8rem;">
                <table style="width: 100%; border-collapse: collapse;">
                    <tbody id="tabla-ventas-body"></tbody>
                </table>
            </div>
        </div>

        <h3 style="color:var(--admin); margin-top:0">Nuevo Producto</h3>
        <input type="text" id="n-prod" placeholder="Nombre">
        <input type="number" id="p-prod" placeholder="Precio ($)">
        <input type="number" id="s-prod" placeholder="Stock">
        <input type="file" id="i-prod" accept="image/*">
        <button class="btn btn-admin" style="display:block; width:100%" onclick="save()">Publicar</button>
        <button onclick="closeModal('modalAdmin')" style="background:none; color:white; width:100%; margin-top:10px; border:none; cursor:pointer;">Cancelar</button>
    </div>
</div>

<div id="modalCart" class="modal">
    <div class="modal-content">
        <h2>Tu Carrito</h2>
        <div id="cart-list"></div>
        
        <div style="margin-top: 15px; border-top: 1px solid #374151; padding-top: 15px;">
            <label style="font-size: 0.9rem; color: #94a3b8;">Método de entrega:</label>
            <select id="shipping-method" onchange="updateCart()">
                <option value="pickup">Retiro en tienda (Gratis)</option>
                <option value="delivery">Envío a Domicilio</option>
            </select>
        </div>

        <div style="display:flex; justify-content: space-between; margin-top:10px">
            <h3>Subtotal:</h3>
            <h3 id="cart-subtotal">$0</h3>
        </div>
        <div id="shipping-line" style="display:none; justify-content: space-between; margin-top:-10px">
            <p>Envío:</p>
            <p id="shipping-price-display">$0</p>
        </div>
        <div style="display:flex; justify-content: space-between; border-top: 1px solid #374151; padding-top: 10px; margin-top:5px">
            <h3>Total:</h3>
            <h3 id="cart-total" style="color:var(--accent)">$0</h3>
        </div>
        
        <button class="btn btn-blue" style="width:100%; justify-content: center;" onclick="checkout()">Finalizar Compra</button>
        <button onclick="closeModal('modalCart')" style="background:none; color:white; width:100%; margin-top:15px; border:none; cursor:pointer;">Volver</button>
    </div>
</div>

<script>
    const SB_URL = "https://rdyclinraavkirzfigjl.supabase.co"; 
    const SB_KEY = "sb_publishable_fEGEgkJNYMzVPgzDaEwlsg_W1XiFyt6";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let products = [];
    let cart = [];
    let user = null;
    let address = "";
    let whatsappMsg = "";
    let shippingCost = 0;
    let storePhone = "";

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function updateStoreName() {
        const newName = document.getElementById('store-name-input').value;
        if(!newName) return;

        const { error } = await supabaseClient
            .from('configuracion')
            .update({ value: newName })
            .eq('key', 'store_name');

        if (error) {
            alert("Error al sincronizar: " + error.message);
        } else {
            document.getElementById('store-logo').innerText = newName;
            document.title = newName;
            alert("¡Nombre de tienda actualizado globalmente!");
        }
    }

    async function updateShippingCost() {
        const cost = document.getElementById('shipping-cost-input').value;
        if(cost === "") return;

        const { error } = await supabaseClient
            .from('configuracion')
            .update({ value: cost })
            .eq('key', 'shipping_cost');

        if (error) {
            alert("Error al actualizar envío: " + error.message);
        } else {
            shippingCost = parseFloat(cost);
            alert("Costo de envío actualizado globalmente");
            updateCart();
        }
    }

    async function updateStorePhone() {
        const phone = document.getElementById('store-phone-input').value.replace(/\+/g, '').trim();
        if(!phone) return alert("Ingresa un número válido");

        const { error } = await supabaseClient
            .from('configuracion')
            .update({ value: phone })
            .eq('key', 'store_phone');

        if (error) {
            alert("Error al actualizar teléfono: " + error.message);
        } else {
            storePhone = phone;
            alert("¡WhatsApp de destino actualizado!");
        }
    }

    window.onload = async () => {
        const { data: config, error } = await supabaseClient.from('configuracion').select('*');
        
        if (!error && config) {
            config.forEach(item => {
                if (item.key === 'store_name') {
                    document.getElementById('store-logo').innerText = item.value;
                    document.getElementById('store-name-input').value = item.value;
                    document.title = item.value;
                }
                if (item.key === 'shipping_cost') {
                    shippingCost = parseFloat(item.value);
                    document.getElementById('shipping-cost-input').value = shippingCost;
                }
                if (item.key === 'store_phone') {
                    storePhone = item.value;
                    document.getElementById('store-phone-input').value = item.value;
                }
            });
        }
        
        fetchProducts();
    };

    async function fetchProducts() {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('store-grid').innerHTML = "";

        const { data, error } = await supabaseClient.from('productos').select('*').order('created_at', { ascending: false });
        
        document.getElementById('loader').style.display = 'none';

        if (error) console.error(error);
        else {
            products = data;
            render();
        }
    }

    async function save() {
        const name = document.getElementById('n-prod').value;
        const price = document.getElementById('p-prod').value;
        const stock = parseInt(document.getElementById('s-prod').value);
        const file = document.getElementById('i-prod').files[0];

        if(!name || !price || !file || isNaN(stock)) return alert("Faltan datos");

        const reader = new FileReader();
        reader.onloadend = async () => {
            const { error } = await supabaseClient.from('productos').insert([{ name, price, stock, img: reader.result }]);
            if (error) alert("Error al guardar: " + error.message);
            else {
                fetchProducts();
                closeModal('modalAdmin');
                document.getElementById('n-prod').value = "";
                document.getElementById('p-prod').value = "";
                document.getElementById('s-prod').value = "";
            }
        };
        reader.readAsDataURL(file);
    }

    async function remove(id) {
        if(confirm("¿Seguro que quieres borrar este producto?")) {
            const { error } = await supabaseClient.from('productos').delete().eq('id', id);
            if(error) alert("Error al borrar");
            else fetchProducts();
        }
    }

    async function checkout() {
        if(cart.length === 0) return;
        
        const isDelivery = document.getElementById('shipping-method').value === "delivery";
        if(isDelivery && (!address || address.trim() === "")) {
            alert("Por favor, ingrese su dirección en el perfil (Acceder) para solicitar envío a domicilio.");
            showModal('modalAuth');
            return;
        }

        let subtotal = 0;
        let summary = {};

        cart.forEach(item => {
            if(!summary[item.id]) summary[item.id] = { name: item.name, qty: 0, price: item.price };
            summary[item.id].qty++;
            subtotal += parseFloat(item.price);
        });

        const total = isDelivery ? subtotal + shippingCost : subtotal;

        // --- REGISTRO CONTABLE EN SUPABASE ---
        const ventaData = {
            cliente: user || "Cliente Anónimo",
            direccion: address || "Retiro en tienda",
            metodo_entrega: document.getElementById('shipping-method').value,
            subtotal: subtotal,
            envio: isDelivery ? shippingCost : 0,
            total: total,
            detalles: Object.values(summary)
        };

        const { error: errVenta } = await supabaseClient.from('ventas').insert([ventaData]);
        if(errVenta) console.error("Error contable:", errVenta);
        // --- FIN REGISTRO CONTABLE ---

        for(let id in summary) {
            const original = products.find(p => p.id == id);
            if(original) {
                const newStock = original.stock - summary[id].qty;
                await supabaseClient.from('productos').update({ stock: newStock }).eq('id', id);
            }
        }

        whatsappMsg = "*PEDIDO DE: " + (user || "Cliente").toUpperCase() + "*%0A";
        whatsappMsg += "*ENTREGA:* " + (isDelivery ? "Envío a Domicilio" : "Retiro en Tienda") + "%0A";
        if(address) whatsappMsg += "*DIRECCIÓN:* " + address + "%0A";
        whatsappMsg += "%0A";

        let html = "";
        for(let id in summary) {
            let s = summary[id];
            html += `<div class="invoice-line"><span>${s.name} x${s.qty}</span><span>$${s.qty * s.price}</span></div>`;
            whatsappMsg += `- ${s.name} (x${s.qty}): $${s.qty * s.price}%0A`;
        }
        
        if(isDelivery) {
            html += `<div class="invoice-line"><span>Costo de Envío</span><span>$${shippingCost}</span></div>`;
            whatsappMsg += `- Envío: $${shippingCost}%0A`;
        }

        whatsappMsg += "%0A*TOTAL: $" + total + "*";

        document.getElementById('invoice-details').innerHTML = html + `<div style="border-top:1px solid #333; margin-top:10px; padding-top:10px; font-weight:bold; display:flex; justify-content:space-between; color:var(--accent)"><span>TOTAL:</span><span>$${total}</span></div>`;
        
        cart = [];
        updateCart();
        fetchProducts();
        closeModal('modalCart');
        showModal('modalInvoice');
    }

    async function cargarContabilidad() {
        const { data: ventas, error } = await supabaseClient.from('ventas').select('*').order('created_at', { ascending: false });
        if (error) return alert("Error: " + error.message);

        let totalDinero = 0;
        let tablaHtml = "";

        ventas.forEach(v => {
            totalDinero += v.total;
            const fecha = new Date(v.created_at).toLocaleDateString();
            tablaHtml += `<tr style="border-bottom: 1px solid #1f2937;">
                <td style="padding: 8px;">${fecha}</td>
                <td style="padding: 8px;">${v.cliente}</td>
                <td style="padding: 8px; color: var(--success); font-weight: bold;">$${v.total}</td>
            </tr>`;
        });

        document.getElementById('stats-total').innerText = `$${totalDinero}`;
        document.getElementById('stats-cantidad').innerText = ventas.length;
        document.getElementById('tabla-ventas-body').innerHTML = tablaHtml || "<tr><td colspan='3' style='text-align:center; padding:10px;'>Sin ventas</td></tr>";
    }

    function login() {
        const u = document.getElementById('u-in').value;
        const p = document.getElementById('p-in').value;
        const a = document.getElementById('a-in').value;
        
        address = a;

        if(u === "admin" && p === "0607") {
            user = "admin";
            document.getElementById('btn-admin').style.display = 'inline-flex';
            document.getElementById('btn-user').innerText = "Modo Admin";
            cargarContabilidad();
        } else if(u && p) {
            user = u;
            document.getElementById('btn-admin').style.display = 'none';
            document.getElementById('btn-user').innerText = "Hola, " + u;
        }
        closeModal('modalAuth');
        render();
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function addCart(id) {
        if(!user) return showModal('modalAuth');
        const p = products.find(x => x.id === id);
        
        const inCart = cart.filter(item => item.id === id).length;
        if(p.stock <= inCart) return alert("No hay más stock disponible");

        cart.push({...p, cartId: Date.now() + Math.random()});
        updateCart();
        showToast();
    }

    function changeQty(id, delta) {
        if (delta > 0) {
            addCart(id);
        } else {
            const index = cart.findLastIndex(item => item.id === id);
            if (index !== -1) {
                cart.splice(index, 1);
            }
            updateCart();
        }
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        updateCart();
    }

    function updateCart() {
        document.getElementById('count').innerText = cart.length;
        
        const grouped = cart.reduce((acc, item) => {
            if (!acc[item.id]) acc[item.id] = { ...item, qty: 0 };
            acc[item.id].qty++;
            return acc;
        }, {});

        let subtotal = 0;
        document.getElementById('cart-list').innerHTML = Object.values(grouped).map(i => {
            subtotal += (parseFloat(i.price) * i.qty);
            return `<div style="padding:10px; background:#1f2937; margin:5px; border-radius:8px; display:flex; justify-content:space-between; align-items:center">
                <div style="display:flex; flex-direction:column">
                    <span>${i.name}</span>
                    <small style="color:var(--accent)">$${i.price} c/u</small>
                </div>
                <div style="display:flex; align-items:center; gap:10px">
                    <button class="qty-btn" onclick="changeQty(${i.id}, -1)">-</button>
                    <span>${i.qty}</span>
                    <button class="qty-btn" onclick="changeQty(${i.id}, 1)">+</button>
                    <i class="fas fa-trash remove-item" onclick="removeFromCart(${i.id})"></i>
                </div>
            </div>`;
        }).join('');
        
        const isDelivery = document.getElementById('shipping-method').value === "delivery";
        const finalShipping = isDelivery ? shippingCost : 0;
        
        document.getElementById('shipping-line').style.display = isDelivery ? 'flex' : 'none';
        document.getElementById('shipping-price-display').innerText = `$${finalShipping}`;
        document.getElementById('cart-subtotal').innerText = `$${subtotal}`;
        document.getElementById('cart-total').innerText = `$${subtotal + finalShipping}`;
    }

    function render() {
        const g = document.getElementById('store-grid');
        g.innerHTML = products.map(p => `
            <div class="card">
                ${user === 'admin' ? `<button class="delete-btn" style="display:block" onclick="remove(${p.id})">Borrar</button>` : ''}
                <img src="${p.img}" loading="lazy">
                <div class="stock-tag ${p.stock <= 0 ? 'out-of-stock' : ''}">${p.stock > 0 ? 'Stock: '+p.stock : 'AGOTADO'}</div>
                <h3 style="margin:5px 0">${p.name}</h3>
                <div style="color:var(--accent); font-weight:bold; margin-bottom:10px">$${p.price}</div>
                <button class="btn btn-blue" style="width:100%; justify-content:center" onclick="addCart(${p.id})" ${p.stock <= 0 ? 'disabled' : ''}>${p.stock <= 0 ? 'Agotado' : 'Añadir'}</button>
            </div>
        `).join('');
    }

    function shareWhatsApp() { 
        if(!storePhone) {
            alert("El administrador no ha configurado un número de WhatsApp destino.");
            return;
        }
        window.open("https://wa.me/" + storePhone + "?text=" + whatsappMsg, '_blank'); 
    }

</script>
