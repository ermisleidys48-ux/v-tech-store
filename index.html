<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Tienda...</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --accent: #38bdf8;
            --text: #f8fafc;
            --admin: #fbbf24;
            --danger: #ef4444;
            --success: #22c55e;
            --glass: rgba(17, 24, 39, 0.7);
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); scroll-behavior: smooth; }

        nav {
            background: var(--glass); backdrop-filter: blur(15px); padding: 1.2rem 8%;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.5rem; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; min-width: 50px; }

        .btn { cursor: pointer; border-radius: 10px; border: none; padding: 10px 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-blue { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: white; }
        .btn-blue:disabled { background: #374151; color: #94a3b8; cursor: not-allowed; }
        .btn-admin { background: var(--admin); color: #000; display: none; margin-right: 12px; }
        
        .btn-whatsapp { background: #25D366; color: white; width: 100%; justify-content: center; margin-top: 15px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }

        .card { background: var(--card); border-radius: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; background: #1f2937; }
        
        .stock-tag { font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.1); margin-bottom: 10px; display: inline-block; }
        .out-of-stock { color: var(--danger); font-weight: bold; }

        .delete-btn { position: absolute; top: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; display: none; z-index: 10; }
        .remove-item { color: var(--danger); cursor: pointer; font-size: 1.2rem; margin-left: 10px; }

        .qty-btn { background: #374151; color: white; border: none; width: 25px; height: 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .qty-btn:hover { background: var(--accent); color: black; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: #111827; padding: 40px; width: 90%; max-width: 450px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); overflow-y: auto; max-height: 90vh; }

        input, select { width: 100%; padding: 14px; margin: 10px 0; background: #030712; border: 1px solid #374151; color: white; border-radius: 12px; box-sizing: border-box; }

        #loader { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 50px 0; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .stats-card { background: #030712; padding: 10px; border-radius: 12px; border: 1px solid #374151; text-align: center; }
        .stats-input { background: #1f2937; border: 1px solid #4b5563; color: white; text-align: center; font-size: 0.9rem; width: 90%; border-radius: 8px; padding: 5px; margin-top: 5px; }
        
        .almacen-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; color: #cbd5e1; }
        .almacen-table th { text-align: left; padding: 8px; background: #1f2937; color: var(--accent); }
        .almacen-table td { padding: 8px; border-bottom: 1px solid #1f2937; }
        .edit-input { width: 50px !important; padding: 4px !important; margin: 0 !important; font-size: 0.7rem; background: #1f2937 !important; text-align: center; }
    </style>
</head>
<body>

<nav>
    <div class="logo" id="store-logo">...</div>
    <div style="display: flex; align-items: center;">
        <button id="btn-admin" class="btn btn-admin" onclick="showModal('modalAdmin')">ADMIN</button>
        <button class="btn btn-blue" onclick="showModal('modalAuth')" id="btn-user">Acceder</button>
        <button class="btn btn-blue" onclick="showModal('modalCart')" style="margin-left: 10px;">
            <i class="fas fa-shopping-cart"></i>&nbsp;<span id="count">0</span>
        </button>
    </div>
</nav>

<div class="container">
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--accent); font-weight: 600;">Cargando productos...</p>
    </div>
    <div id="store-grid" class="grid"></div>
</div>

<div id="modalAdmin" class="modal">
    <div class="modal-content">
        <h2 style="color:var(--admin); text-align: center;">Sistema Contable</h2>
        
        <div style="margin-bottom: 20px; border: 1px solid #374151; padding: 15px; border-radius: 15px;">
            <h3 style="color: var(--accent); font-size: 0.9rem; margin-top: 0;"><i class="fas fa-calculator"></i> Estado Resultado (Ingreso - Gasto)</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="stats-card">
                    <small style="color: #94a3b8;">Ingreso ($)</small>
                    <input type="number" id="inp-ingreso" class="stats-input" value="0" oninput="calcularContabilidad()">
                </div>
                <div class="stats-card">
                    <small style="color: #94a3b8;">Gasto ($)</small>
                    <input type="number" id="inp-gasto" class="stats-input" value="0" oninput="calcularContabilidad()">
                </div>
            </div>
            <div class="stats-card" style="margin-top: 10px; border-color: var(--success);">
                <small>Resultado Final</small>
                <h3 id="res-estado" style="margin: 5px 0; color: var(--success);">$0</h3>
            </div>
        </div>

        <div style="margin-bottom: 20px; border: 1px solid #374151; padding: 15px; border-radius: 15px;">
            <h3 style="color: var(--admin); font-size: 0.9rem; margin-top: 0;"><i class="fas fa-cash-register"></i> Efectivo en Caja (Ingreso x Ventas)</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="stats-card">
                    <small style="color: #94a3b8;">Ingreso x Venta ($)</small>
                    <input type="number" id="inp-ingreso-venta" class="stats-input" value="0" oninput="calcularContabilidad()">
                </div>
                <div class="stats-card">
                    <small style="color: #94a3b8;">Cant. Ventas</small>
                    <input type="number" id="inp-cant-ventas" class="stats-input" value="0" oninput="calcularContabilidad()">
                </div>
            </div>
            <div class="stats-card" style="margin-top: 10px; border-color: var(--accent);">
                <small>Total en Caja</small>
                <h3 id="res-caja" style="margin: 5px 0; color: var(--accent);">$0</h3>
            </div>
        </div>

        <button class="btn btn-blue" style="width:100%; justify-content:center" onclick="guardarDatosContables()">Guardar Contabilidad</button>

        <hr style="border: 0; border-top: 1px solid #374151; margin: 20px 0;">

        <h3 style="color:var(--accent); font-size: 1rem;"><i class="fas fa-warehouse"></i> Almacén</h3>
        <div style="max-height: 150px; overflow-y: auto; background: #030712; border-radius: 10px; border: 1px solid #374151; margin-bottom: 10px;">
            <table class="almacen-table">
                <thead><tr><th>Producto</th><th>Stock</th><th>Comp.</th><th>Vent.</th><th></th></tr></thead>
                <tbody id="almacen-body"></tbody>
            </table>
        </div>

        <h3 style="color:var(--admin); margin-top:20px">Nuevo Producto</h3>
        <input type="text" id="n-prod" placeholder="Nombre">
        <input type="number" id="p-prod" placeholder="Precio Venta">
        <input type="number" id="c-prod" placeholder="Precio Compra">
        <input type="number" id="s-prod" placeholder="Stock Inicial">
        <input type="file" id="i-prod" accept="image/*">
        <button class="btn btn-admin" style="display:block; width:100%" onclick="save()">Publicar</button>
        <button onclick="closeModal('modalAdmin')" style="background:none; color:white; width:100%; margin-top:10px; border:none; cursor:pointer;">Cerrar</button>
    </div>
</div>

<div id="modalAuth" class="modal"><div class="modal-content"><h2>Acceder</h2><input type="text" id="u-in" placeholder="Usuario"><input type="password" id="p-in" placeholder="Clave"><button class="btn btn-blue" style="width:100%" onclick="login()">Entrar</button></div></div>
<div id="modalCart" class="modal"><div class="modal-content"><h2>Carrito</h2><div id="cart-list"></div><h3 id="cart-total">Total: $0</h3><button class="btn btn-blue" style="width:100%" onclick="checkout()">Comprar</button><button onclick="closeModal('modalCart')">Volver</button></div></div>

<script>
    const SB_URL = "https://rdyclinraavkirzfigjl.supabase.co"; 
    const SB_KEY = "sb_publishable_fEGEgkJNYMzVPgzDaEwlsg_W1XiFyt6";
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    let products = [];
    let cart = [];
    let user = null;

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function calcularContabilidad() {
        const ingreso = parseFloat(document.getElementById('inp-ingreso').value) || 0;
        const gasto = parseFloat(document.getElementById('inp-gasto').value) || 0;
        document.getElementById('res-estado').innerText = `$${ingreso - gasto}`;

        const ingresoVenta = parseFloat(document.getElementById('inp-ingreso-venta').value) || 0;
        const cantVentas = parseFloat(document.getElementById('inp-cant-ventas').value) || 0;
        document.getElementById('res-caja').innerText = `$${ingresoVenta * cantVentas}`;
    }

    async function guardarDatosContables() {
        const datos = [
            { key: 'cont_ingreso', value: document.getElementById('inp-ingreso').value },
            { key: 'cont_gasto', value: document.getElementById('inp-gasto').value },
            { key: 'cont_ingreso_venta', value: document.getElementById('inp-ingreso-venta').value },
            { key: 'cont_cant_ventas', value: document.getElementById('inp-cant-ventas').value }
        ];
        const { error } = await supabaseClient.from('configuracion').upsert(datos);
        if (error) alert("Error: " + error.message);
        else alert("Contabilidad guardada");
    }

    window.onload = async () => {
        const { data: config } = await supabaseClient.from('configuracion').select('*');
        if (config) {
            config.forEach(item => {
                if (item.key === 'cont_ingreso') document.getElementById('inp-ingreso').value = item.value;
                if (item.key === 'cont_gasto') document.getElementById('inp-gasto').value = item.value;
                if (item.key === 'cont_ingreso_venta') document.getElementById('inp-ingreso-venta').value = item.value;
                if (item.key === 'cont_cant_ventas') document.getElementById('inp-cant-ventas').value = item.value;
                if (item.key === 'store_name') document.getElementById('store-logo').innerText = item.value;
            });
            calcularContabilidad();
        }
        fetchProducts();
    };

    async function fetchProducts() {
        const { data, error } = await supabaseClient.from('productos').select('*').order('created_at', { ascending: false });
        if (!error) { products = data; render(); renderAlmacen(); }
    }

    function renderAlmacen() {
        document.getElementById('almacen-body').innerHTML = products.map(p => `
            <tr>
                <td>${p.name}</td>
                <td><input type="number" class="edit-input" value="${p.stock}" onchange="editProduct(${p.id}, 'stock', this.value)"></td>
                <td><input type="number" class="edit-input" value="${p.costo_compra}" onchange="editProduct(${p.id}, 'costo_compra', this.value)"></td>
                <td><input type="number" class="edit-input" value="${p.price}" onchange="editProduct(${p.id}, 'price', this.value)"></td>
                <td><i class="fas fa-trash" onclick="remove(${p.id})"></i></td>
            </tr>
        `).join('');
    }

    async function editProduct(id, field, value) {
        let obj = {}; obj[field] = value;
        await supabaseClient.from('productos').update(obj).eq('id', id);
        fetchProducts();
    }

    async function save() {
        const name = document.getElementById('n-prod').value;
        const price = document.getElementById('p-prod').value;
        const cost = document.getElementById('c-prod').value;
        const stock = document.getElementById('s-prod').value;
        const file = document.getElementById('i-prod').files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onloadend = async () => {
            await supabaseClient.from('productos').insert([{ name, price, costo_compra: cost, stock, img: reader.result }]);
            fetchProducts();
        };
        reader.readAsDataURL(file);
    }

    async function remove(id) { if(confirm("¿Borrar?")) { await supabaseClient.from('productos').delete().eq('id', id); fetchProducts(); } }

    function render() {
        document.getElementById('store-grid').innerHTML = products.map(p => `
            <div class="card">
                <img src="${p.img}">
                <h3>${p.name}</h3>
                <p>$${p.price}</p>
                <button class="btn btn-blue" onclick="addCart(${p.id})" ${p.stock <= 0 ? 'disabled' : ''}>${p.stock > 0 ? 'Añadir' : 'Agotado'}</button>
            </div>
        `).join('');
    }

    function login() {
        if(document.getElementById('u-in').value === "admin" && document.getElementById('p-in').value === "0607") {
            user = "admin"; document.getElementById('btn-admin').style.display = 'block'; closeModal('modalAuth');
        }
    }
    
    // Funciones básicas de carrito omitidas por brevedad, funcionan igual que antes.
</script>
</body>
</html>
